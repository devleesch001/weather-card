version: '3.1'

services:

    mongo:
        image: mongo:6-jammy
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - "./data/db:/data/db"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: Endorphin2-Gravel5-Disjoin4

    cache:
        image: redis:6.2-alpine
        restart: always
        ports:
            - '6379:6379'
        command: redis-server
        volumes:
            - "./cache:/data"

    mongo-express:
        image: mongo-express
        restart: always
        ports:
            - "8081:8081"
        environment:
            ME_CONFIG_BASICAUTH_ENABLED: true
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_BASICAUTH_PASSWORD: Enclosure2-Client2-Wimp0

            ME_CONFIG_MONGODB_URL: mongodb://root:Endorphin2-Gravel5-Disjoin4@mongo:27017/